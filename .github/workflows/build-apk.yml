name: Build Android APK

on:
  workflow_dispatch:

concurrency:
  group: piano-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Gradle 7.5
        run: |
          curl -L --retry 3 --retry-delay 10 -o /tmp/gradle-7.5-bin.zip "https://services.gradle.org/distributions/gradle-7.5-bin.zip"
          unzip -o /tmp/gradle-7.5-bin.zip -d /tmp/
          /tmp/gradle-7.5/bin/gradle --version

      - name: Build Debug APK
        run: /tmp/gradle-7.5/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pianokid-debug-apk
          path: app/build/outputs/apk/debug/*.apk