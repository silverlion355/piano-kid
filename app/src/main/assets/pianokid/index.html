<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>钢琴小达人</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ========== 首页（关卡地图）========== -->
<div id="screen-home" class="screen active">
  <div class="home-header">
    <h1>🎹 钢琴小达人</h1>
    <div class="home-user-info">
      <span id="home-username">钢琴小白</span>
      <span id="home-level">Lv.1</span>
      <span>💰 <span id="home-coins">0</span></span>
      <span>⭐ <span id="home-stars">0</span>/18</span>
    </div>
  </div>

  <div id="level-list" class="level-list"></div>

  <div class="home-bottom-btns">
    <button class="btn-nav" onclick="App.showScreen('shop-screen')">🛒商店</button>
    <button class="btn-nav" onclick="App.showScreen('records-screen')">📋记录</button>
    <button class="btn-nav" onclick="App.showScreen('log-screen')">📋日志</button>
  </div>

  <div class="version-watermark" id="version-text">版本 1.0.0</div>
</div>

<!-- ========== 游戏页面 ========== -->
<div id="screen-game" class="screen">
  <div class="game-nav">
    <button class="btn-back" onclick="App.confirmQuit()">‹</button>
    <span id="game-title">小星星</span>
    <span>💰 <span id="game-coins">0</span></span>
  </div>

  <div class="game-area">
    <div class="staff-area">
      <canvas id="staff-canvas"></canvas>
    </div>
    <div class="piano-area">
      <div id="piano-keys"></div>
    </div>
    <div class="game-status-bar">
      <span id="mic-status">🎤 麦克风就绪</span>
      <span>得分: <span id="game-score">0</span></span>
      <span>连击: <span id="game-combo">0</span></span>
      <span id="game-stars">⭐☆☆</span>
    </div>
  </div>

  <div id="judgment-overlay" class="judgment-overlay"></div>
</div>

<!-- ========== 结算页面 ========== -->
<div id="screen-result" class="screen">
  <div class="result-box">
    <h2 id="result-title">🎉 恭喜通关！</h2>
    <div id="result-stars" class="result-stars">⭐⭐⭐</div>
    <div id="result-score" class="result-score">得分: 9800</div>
    <div class="result-details">
      <div>Perfect: <span id="r-perfect">0</span></div>
      <div>Good: <span id="r-good">0</span></div>
      <div>Miss: <span id="r-miss">0</span></div>
      <div>最高连击: <span id="r-combo">0</span></div>
    </div>
    <div class="result-reward">
      获得 💰 <span id="r-coins">0</span> 金币
      <span id="r-new-star" style="display:none">🌟 新纪录！</span>
    </div>
    <div class="result-btns">
      <button class="modal-btn" onclick="App.replayGame()">🔄 重玩</button>
      <button class="modal-btn" id="btn-next" onclick="App.nextSong()">下一关 ›</button>
      <button class="modal-btn secondary" onclick="App.goHome()">返回主页</button>
    </div>
  </div>
</div>

<!-- ========== 商店页面 ========== -->
<div id="screen-shop" class="screen">
  <div class="top-bar">
    <button class="btn-back" onclick="App.showScreen('home-screen')">‹</button>
    <h3>🛒 积分商店</h3>
    <span>💰 <span id="shop-my-coins">0</span></span>
  </div>
  <div class="shop-content">
    <div class="shop-item" onclick="App.buyItem('freetime1')">
      <div class="shop-item-icon">⏰</div>
      <div class="shop-item-info">
        <h4>1分钟休闲时长</h4>
        <p>休息一下，继续加油！</p>
      </div>
      <div class="shop-item-price">100 💰</div>
    </div>
    <div class="shop-item" onclick="App.buyItem('freetime5')">
      <div class="shop-item-icon">⏰</div>
      <div class="shop-item-info">
        <h4>5分钟休闲时长</h4>
        <p>休息一下吧！</p>
      </div>
      <div class="shop-item-price">400 💰</div>
    </div>
    <div class="shop-item" onclick="App.buyItem('unlock')">
      <div class="shop-item-icon">🔓</div>
      <div class="shop-item-info">
        <h4>解锁任意关卡</h4>
        <p>跳过前置关卡，直接挑战！</p>
      </div>
      <div class="shop-item-price">200 💰</div>
    </div>
  </div>
</div>

<!-- ========== 记录页面 ========== -->
<div id="screen-records" class="screen">
  <div class="top-bar">
    <button class="btn-back" onclick="App.showScreen('home-screen')">‹</button>
    <h3>📋 通关记录</h3>
  </div>
  <div id="records-list" class="records-list"></div>
</div>

<!-- ========== 日志页面 ========== -->
<div id="screen-log" class="screen">
  <div class="top-bar">
    <button class="btn-back" onclick="App.showScreen('home-screen')">‹</button>
    <h3>📋 调试日志</h3>
    <button class="btn-small" onclick="GameLog.clear()">清空</button>
    <button class="btn-small" onclick="GameLog.copyAll()">复制全部</button>
  </div>
  <div id="log-content" class="log-content"></div>
</div>

<!-- ========== 确认退出弹窗 ========== -->
<div id="modal-quit" class="modal-overlay" style="display:none">
  <div class="modal">
    <h2>确定要退出吗？</h2>
    <p>当前进度将不会保存。</p>
    <div class="modal-btns">
      <button class="modal-btn" onclick="App.hideQuitModal()">继续游戏</button>
      <button class="modal-btn secondary" onclick="App.quitGame()">退出</button>
    </div>
  </div>
</div>

<!-- ========== 休闲计时弹窗 ========== -->
<div id="modal-freetime" class="modal-overlay" style="display:none">
  <div class="modal">
    <h2>⏰ 休闲时间</h2>
    <p id="freetime-timer">5:00</p>
    <div class="modal-btns">
      <button class="modal-btn secondary" onclick="App.closeFreetime()">结束休息</button>
    </div>
  </div>
</div>

<script src="js/log.js"></script>
<script src="js/storage.js"></script>
<script src="js/songs.js"></script>
<script src="js/pitch-detector.js"></script>
<script src="js/piano.js"></script>
<script src="js/staff.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>
</body>
</html>
